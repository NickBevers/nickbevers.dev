services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nickbevers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nickbevers']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
